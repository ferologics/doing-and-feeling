# Seed researchers for the field map.
#
# camps    position families, first pass from Doing and Feeling (unreviewed until each has a source):
#          global-workspace, higher-order, recurrent-processing, iit, predictive-processing, attention-schema,
#          illusionism, self-model, neurorepresentationalism, biological-naturalism, panpsychism, idealism, orch-or,
#          dualism, ual (unlimited associative learning), evolution, basal-cognition, metacognition, methods (measures,
#          theory testing, adversarial collaborations, clinical),
#          ai-consciousness (assessing AI systems), ai-welfare (moral status, precaution), computational-functionalism
# crux     "yes" | "no": is the right computation enough for consciousness? Only with crux_source.
# hint     substring of an affiliation or topic, used to pick the right OpenAlex author.
# openalex OpenAlex author ID, pinned after review ("none" = not attributable in OpenAlex). Remove it to re-run the
#          automatic match, which uses `hint`.
# died     year, for people whose work is historical on the map.
# watch    "core" for people who publish widely outside the field: the watch then keeps only their works about
#          consciousness, sentience, experience, minds or moral status.

